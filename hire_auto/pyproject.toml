[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hire_auto"
version = "0.0.1"
description = "Identify the trip duration for the specific booking"
authors = [
  { name = "Deepak" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["hire_auto"]
include = ["pyproject.toml", "hire_auto/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["hire_auto"]
force-sort-within-sections = true

